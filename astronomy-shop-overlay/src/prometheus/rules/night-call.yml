groups:
  - name: night-call
    interval: 15s
    rules:
      - alert: RecommendationCrashed
        expr: resets(container_uptime_seconds{container_name="recommendation"}[2m]) > 0
        labels:
          service: recommendation
          severity: page
        annotations:
          summary: recommendation container restarted in the last 2 minutes

      - alert: RecommendationRequestsFailing
        expr: |
          (
            sum(rate(traces_span_metrics_calls_total{service_name="recommendation", span_name="oteldemo.RecommendationService/ListRecommendations", status_code="STATUS_CODE_ERROR"}[2m]))
            or vector(0)
          )
          +
          (
            sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_name="GET /api/recommendations", status_code="STATUS_CODE_ERROR"}[2m]))
            or vector(0)
          )
          > 0
        for: 1m
        labels:
          service: recommendation
          severity: page
        annotations:
          summary: recommendation requests are failing

      - alert: RecommendationCanaryFailing
        expr: |
          max(httpcheck_status{http_url=~".*api/recommendations.*", http_status_class="2xx"}) < 1
          or
          max(httpcheck_error{http_url=~".*api/recommendations.*"}) > 0
        for: 1m
        labels:
          service: recommendation
          severity: page
        annotations:
          summary: recommendations canary request is failing
